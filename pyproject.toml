[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "Louan Bardou" },
  { name = "Lancelot Brisset" },
  { name = "Alix Bernal" },
  { name = "Blanche Mahe" },
]
description = "X-HEC MLOps Project on Abalone age prediction model"
requires-python = ">=3.10,<3.12"
dependencies = [
  "pandas",
  "scikit-learn",
  "prefect",
  "fastapi",
  "uvicorn",
  "pydantic",
  "mlflow>=3.17.2",
]

[dependency-groups]
dev = [
  "ruff",
  "pre-commit",
  "pytest",
  "jupyter",
  "matplotlib",
  "seaborn",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools]
packages = []
